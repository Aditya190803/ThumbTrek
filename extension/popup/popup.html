<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>ThumbTrek</title>
  <link rel="stylesheet" href="../ui/trek.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Everything below renders from IndexedDB alone. No account, no network, no exceptions:
       contract §5 makes local storage the source of truth and the network a mirror, so this
       surface has to be complete without either. -->
  <main class="sheet" id="sheet" aria-busy="true">

    <!-- The track: today's lap oval and its lane rows, on track blue in both themes. -->
    <div class="band on-track">
      <div class="inner">
        <header class="head">
          <h1 class="brand">
            <svg class="mark" viewBox="0 0 40 24" fill="none" aria-hidden="true">
              <rect width="40" height="24" rx="12" fill="#2340E0" />
              <rect x="0.75" y="0.75" width="38.5" height="22.5" rx="11.25" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" />
              <rect x="10" y="9" width="20" height="6" rx="3" fill="#1A2FB0" />
              <rect x="5" y="5" width="30" height="14" rx="7" stroke="#D7FF3A" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="72 100" />
            </svg>
            ThumbTrek
          </h1>
          <span class="caption" id="today-label"></span>
        </header>

        <!-- Failures land here, in the one place the user is already looking. -->
        <p class="alert" id="error" role="alert" hidden></p>

        <section aria-labelledby="today-title">
          <h2 class="visually-hidden" id="today-title">Today</h2>

          <!-- Lane 1 is the total, lanes 2 to 5 the day's biggest sites. Drawn by popup.js
               from lib/oval.js. The label on the SVG carries every figure in words. -->
          <div class="oval" id="oval">
            <svg id="oval-svg" viewBox="0 0 1000 740" role="img" aria-label="Today drawn as a running track."></svg>
            <div class="oval-infield-text" aria-hidden="true">
              <!-- Empty, not "0 m", until the database answers: a zero for a beat on every
                   open reads as "you scrolled nothing" to someone who just did. -->
              <p class="oval-figure num"><span id="hero-figure"></span><span class="unit" id="hero-unit"></span></p>
              <p class="oval-caption" id="oval-caption">&nbsp;</p>
            </div>
          </div>

          <ol class="lanes" id="lanes" aria-label="Today, lane by lane"></ol>

          <!-- What the "Other" lane is made of, so no site's distance is hidden in a sum. -->
          <div class="others" id="others" hidden>
            <h3 class="caption" id="others-title">In lane 5, Other</h3>
            <ul id="others-list" aria-labelledby="others-title"></ul>
          </div>

          <div class="empty" id="empty" hidden>
            <h3 id="empty-title"></h3>
            <p id="empty-text"></p>
          </div>

          <p class="comparison" id="comparison" hidden></p>
        </section>
      </div>
    </div>

    <div class="inner ground">
      <!-- Day eight: the baseline week has become a limit. Announced, never slipped in. -->
      <section class="panel notice" id="auto-limit" aria-labelledby="auto-limit-title" hidden>
        <h2 class="heading" id="auto-limit-title">Your daily limit is set</h2>
        <p class="dim" id="auto-limit-text"></p>
        <div class="notice-actions">
          <button class="btn btn-primary" id="auto-keep" type="button">Keep this limit</button>
          <button class="btn btn-ghost" id="auto-adjust" type="button">Change it</button>
        </div>
        <button class="link-btn" id="auto-decline" type="button">Track without a limit</button>
      </section>

      <!-- The page you were on when you opened this, and one click to count it (or stop). -->
      <div class="here" id="here" hidden>
        <span id="here-text"></span>
        <button class="link-btn" id="here-action" type="button"></button>
      </div>

      <section aria-labelledby="facts-title">
        <h2 class="heading" id="facts-title">Limit and streaks</h2>
        <dl class="facts">
          <div class="fact" id="limit">
            <dt id="limit-title">Daily limit</dt>
            <dd class="fact-value">
              <span class="num" id="limit-value"></span>
              <span class="chip" id="limit-status" hidden></span>
            </dd>
            <dd class="fact-note" id="limit-text" hidden></dd>
            <dd class="fact-note" id="baseline" hidden>
              <button class="btn btn-ghost" id="set-limit" type="button">Learn my baseline</button>
            </dd>
          </div>
          <div class="fact">
            <dt>Streak</dt>
            <dd class="fact-value num" id="streak-text"></dd>
          </div>
          <div class="fact" id="clean-streak" hidden>
            <dt>Days within limit</dt>
            <dd class="fact-value num" id="clean-streak-text"></dd>
          </div>
          <div class="fact" id="delta-row" hidden>
            <dt>Compared with yesterday</dt>
            <dd class="fact-value num" id="delta"></dd>
          </div>
          <div class="fact">
            <dt>This week</dt>
            <dd class="fact-value num" id="week-total"></dd>
          </div>
          <div class="fact">
            <dt>Best day</dt>
            <dd class="fact-value num" id="best-day"></dd>
            <dd class="fact-note" id="best-day-when"></dd>
          </div>
          <div class="fact">
            <dt>All time</dt>
            <dd class="fact-value num" id="all-time"></dd>
            <dd class="fact-note" id="badge-count"></dd>
          </div>
        </dl>
      </section>

      <!-- A Premium feature shown as its normal row. Nothing here is locked or sold yet. -->
      <button class="premium-row" id="open-premium" type="button">
        <span>One limit across your phone and your browser</span>
        <span class="chip">Premium</span>
      </button>

      <footer class="foot">
        <button class="link-btn" id="open-options" type="button">Settings, history and badges</button>
      </footer>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
