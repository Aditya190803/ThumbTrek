# Builds the signed Android App Bundle for Google Play. This is the release/play branch's
# workflow. main keeps its own, which publishes the sideloaded APK and update.json that
# the in-app updater reads. This branch has no updater, so it publishes neither.
#
# Trigger: push a play tag pointing at a commit on release/play.
#
#     git tag -a play-v0.7.0 -m "What changed"
#     git push origin play-v0.7.0
#
# Bump `versionCode` first: Play rejects an upload whose versionCode it has already seen,
# and that counter is shared with the sideloaded line if both use the same applicationId.
#
# The .aab is attached to the workflow run as an artifact. Upload it in Play Console →
# Release → (track) → Create new release. Automating the upload needs a Play service
# account (r0adkll/upload-google-play or the Play Developer API) and is left out on
# purpose until the first manual release has gone through review.
#
# Required repository secrets (the same ones main's workflow uses):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#     The upload key. If you enroll in Play App Signing with the existing release key as
#     the app signing key, the Play build and the sideloaded APK share a signature, so
#     people can move from one to the other without uninstalling.
#   GOOGLE_SERVICES_JSON
#     The real app/google-services.json. Required here, not optional: without it sign-in
#     breaks, and the Crashlytics mapping file can't be uploaded, so R8-obfuscated crash
#     reports would be unreadable.
name: Play release

on:
  push:
    tags:
      - "play-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the real Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing. A Play build without it ships broken sign-in."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Play only accepts signed bundles."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/thumbtrek-release.jks"
          test -s "${RUNNER_TEMP}/thumbtrek-release.jks"

      - name: Build the signed bundle
        env:
          THUMBTREK_KEYSTORE_FILE: ${{ runner.temp }}/thumbtrek-release.jks
          THUMBTREK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          THUMBTREK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          THUMBTREK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # testReleaseUnitTest runs the suite against the release variant as well.
        run: ./gradlew --no-daemon testReleaseUnitTest bundleRelease

      - name: Verify the bundle is signed
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          # jarsigner -verify exits 0 on unsigned jars too, so require the "jar verified."
          # line and print the certificate for the record.
          jarsigner -verify -verbose:summary -certs "$AAB" | tee verify.txt
          grep -q "jar verified." verify.txt
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp "$AAB" "dist/thumbtrek-${VERSION_NAME}.aab"
          cp -r app/build/outputs/mapping/release dist/mapping

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: thumbtrek-play-bundle
          path: dist/
