# Cuts a signed ThumbTrek release and publishes everything the in-app updater needs.
#
# Trigger: push a version tag.
#
#     git tag -a v0.2.0 -m "What changed in this build"
#     git push origin v0.2.0
#
# The tag's annotation message becomes the release notes shown inside the app, so write it
# for a human. Bump `versionCode` and `versionName` in app/build.gradle.kts first — the
# updater compares versionCode, and a release whose versionCode is not higher than the
# installed one is invisible to it.
#
# `workflow_dispatch` runs the same build without publishing, so the signing setup can be
# tested before a real release exists.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64        base64 of the release .jks
#   KEYSTORE_PASSWORD      the store password
#   KEY_ALIAS              the key alias inside the store
#   KEY_PASSWORD           the key password
#   GOOGLE_SERVICES_JSON   (optional) the real app/google-services.json, so release builds
#                          can sign in to Firebase. Without it the build falls back to the
#                          committed placeholder and Google Sign-In will not work.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed to create the GitHub Release and upload its assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Annotated tag contents are the release notes, and they only exist with tags fetched.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the real Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Warn when building against the Firebase placeholder
        if: env.GOOGLE_SERVICES_JSON == ''
        run: |
          echo "::warning::GOOGLE_SERVICES_JSON secret is not set — this build uses the committed placeholder and Google Sign-In will fail in it."

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — refusing to publish an unsigned build."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/thumbtrek-release.jks"
          # Sanity check: base64 -d happily produces garbage from a mangled paste.
          test -s "${RUNNER_TEMP}/thumbtrek-release.jks"

      - name: Build the signed release APK
        env:
          # These are the env-var fallbacks app/build.gradle.kts reads when there is no
          # local keystore.properties.
          THUMBTREK_KEYSTORE_FILE: ${{ runner.temp }}/thumbtrek-release.jks
          THUMBTREK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          THUMBTREK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          THUMBTREK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is actually signed
        id: verify
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "Verifying $APK"
          # Fails the workflow on an unsigned/debug-signed APK, and prints the certificate
          # fingerprints — the SHA-1 below is what Firebase needs for Google Sign-In.
          "$APKSIGNER" verify --print-certs --verbose "$APK"

      - name: Assemble the release assets
        id: assets
        run: |
          set -euo pipefail
          META=app/build/outputs/apk/release/output-metadata.json
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$META")
          SOURCE=app/build/outputs/apk/release/$(jq -r '.elements[0].outputFile' "$META")

          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            # Dry run from workflow_dispatch — nothing is published, but the URL still has
            # to be well formed so the manifest can be eyeballed.
            TAG="v${VERSION_NAME}"
          fi

          mkdir -p dist
          APK_NAME="thumbtrek-${VERSION_NAME}.apk"
          cp "$SOURCE" "dist/${APK_NAME}"

          SHA256=$(sha256sum "dist/${APK_NAME}" | cut -d' ' -f1)
          SIZE=$(stat -c%s "dist/${APK_NAME}")

          # Annotated tag message is the release notes; fall back to the commit subject.
          NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)
          if [ -z "${NOTES//[$'\n\r\t ']/}" ]; then
            NOTES=$(git log -1 --pretty=%s)
          fi

          # This is the file the app polls. Keep the shape in sync with
          # app/src/main/java/com/thumbtrek/app/update/UpdateManifest.kt.
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}" \
            --arg sha256 "$SHA256" \
            --argjson sizeBytes "$SIZE" \
            --arg notes "$NOTES" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, sizeBytes: $sizeBytes, notes: $notes, publishedAt: $publishedAt}' \
            > dist/update.json

          cat dist/update.json
          {
            echo "tag=${TAG}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

      # Dry run: keep the artifacts for inspection, publish nothing.
      - name: Upload build artifacts (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: thumbtrek-release-dry-run
          path: dist/

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: ThumbTrek ${{ steps.assets.outputs.version_name }}
          generate_release_notes: true
          files: |
            dist/thumbtrek-${{ steps.assets.outputs.version_name }}.apk
            dist/update.json
